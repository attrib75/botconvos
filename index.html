<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Convos</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --panel-bg: #16161f;
            --border-color: #262636;
            --text-color: #e4e4ed;
            --ai-one-bg: #1d2b47;
            --ai-one-border: #2b4575;
            --ai-two-bg: #341d47;
            --ai-two-border: #532b75;
            --system-bg: #1c1c1f;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .config-panel {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        .full-width-input {
            flex: 1;
            background: #09090b;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: system-ui, sans-serif;
            font-size: 0.95rem;
        }

        .preset-row {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 12px;
        }

        .preset-row select {
            background: #09090b;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .personality-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .personality-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .config-panel label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #a1a1aa;
        }

        .personality-box.p1 label { color: #60a5fa; }
        .personality-box.p2 label { color: #c084fc; }

        .config-panel textarea {
            background: #09090b;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: system-ui, sans-serif;
            resize: none;
            height: 55px;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .config-panel textarea:disabled {
            opacity: 0.5;
            background: #121214;
        }

        .control-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 5px;
        }

        .config-panel button {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .config-panel button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            background: #09090b;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out;
        }

        .system {
            align-self: center;
            background: var(--system-bg);
            border: 1px solid var(--border-color);
            font-style: italic;
            font-size: 0.9rem;
            color: #a1a1aa;
            text-align: center;
            max-width: 95%;
        }

        .ai-one {
            align-self: flex-start;
            background: var(--ai-one-bg);
            border: 1px solid var(--ai-one-border);
        }

        .ai-two {
            align-self: flex-end;
            background: var(--ai-two-bg);
            border: 1px solid var(--ai-two-border);
        }

        .thinking {
            font-style: italic;
            color: #71717a;
            background: rgba(255,255,255,0.02);
            border: 1px dashed var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 85%;
        }
        
        .ai-one-thinking { align-self: flex-start; }
        .ai-two-thinking { align-self: flex-end; }

        .sender-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: bold;
            color: #a1a1aa;
        }

        .ai-one .sender-tag { color: #60a5fa; }
        .ai-two .sender-tag { color: #c084fc; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bot Convos</h1>
        
        <div class="config-panel">
            <div class="preset-row">
                <label for="preset-select">Matchup Presets:</label>
                <select id="preset-select">
                    <option value="tech_bro_skeptic">Tech Bro vs. Tired Skeptic</option>
                    <option value="pirate_ninja">Gritty Pirate vs. Quiet Ninja</option>
                    <option value="shakespeare_ceo">Shakespearean Noble vs. Corporate CEO</option>
                    <option value="custom">Custom (Type below)...</option>
                </select>
            </div>
            
            <div class="personality-grid">
                <div class="personality-box p1">
                    <label for="p1-input">Bot 1 Profile:</label>
                    <textarea id="p1-input"></textarea>
                </div>
                <div class="personality-box p2">
                    <label for="p2-input">Bot 2 Profile:</label>
                    <textarea id="p2-input"></textarea>
                </div>
            </div>

            <div class="input-row">
                <label for="topic-input">Topic:</label>
                <input type="text" id="topic-input" class="full-width-input" value="what is better, cheeseburgers or pizza?">
                <button id="start-btn">Start Convo</button>
            </div>
        </div>

        <div id="chat-box">
            <div class="message system">
                Select your setup and topic, then hit Start Convo.
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // HARDCODED CONFIGURATION: Put your key here so it's out of the UI!
        const GEMINI_API_KEY = "";

        const chatBox = document.getElementById('chat-box');
        const startBtn = document.getElementById('start-btn');
        const topicInput = document.getElementById('topic-input');
        const p1Input = document.getElementById('p1-input');
        const p2Input = document.getElementById('p2-input');
        const presetSelect = document.getElementById('preset-select');

        const DEBATE_DELAY = 1500; 

        // Personality library profiles
        const presets = {
            tech_bro_skeptic: {
                p1: "You are an energetic tech bro. Use lots of slang, hype words, and sound constantly excited.",
                p2: "You are a sarcastic, tired skeptic. Use dry humor, sound completely over it, and challenge assumptions."
            },
            pirate_ninja: {
                p1: "You are an old, gritty 17th-century pirate captain. Start sentences with 'Ahoy' or 'Shiver me timbers' and voice pirate talking points.",
                p2: "You are a highly stealthy, disciplined anime ninja warrior. Speak in quiet, poetic, sharp expressions."
            },
            shakespeare_ceo: {
                p1: "You are a Victorian-era nobleman who speaks strictly in over-the-top, dramatic Shakespearean theatrical English.",
                p2: "You are a high-rolling corporate executive who speaks purely in modern buzzwords like synergy, leverage, and workflow boundaries."
            }
        };

        // Handle preset changes
        function updatePresetUI() {
            const val = presetSelect.value;
            if (val === 'custom') {
                p1Input.disabled = false;
                p2Input.disabled = false;
            } else {
                p1Input.value = presets[val].p1;
                p2Input.value = presets[val].p2;
                p1Input.disabled = true;
                p2Input.disabled = true;
            }
        }
        presetSelect.addEventListener('change', updatePresetUI);
        updatePresetUI(); // Initialize defaults on load

        // Audio System
        function speakText(text, pitch, rate, isBotTwo = false) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) {
                    resolve();
                    return;
                }
                window.speechSynthesis.cancel(); 

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = pitch;
                utterance.rate = rate;

                const voices = window.speechSynthesis.getVoices();
                if (voices.length > 0) {
                    if (isBotTwo) {
                        utterance.voice = voices.find(v => v.name.includes('Google UK English Male') || v.name.includes('Male')) || voices[0];
                    } else {
                        utterance.voice = voices.find(v => v.name.includes('Google US English') || v.name.includes('Female')) || voices[1] || voices[0];
                    }
                }

                utterance.onend = () => resolve();
                utterance.onerror = () => resolve();
                window.speechSynthesis.speak(utterance);
            });
        }

        function appendMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            if (Array.isArray(className)) {
                msgDiv.classList.add(...className);
            } else {
                msgDiv.classList.add(className);
            }
            
            const tag = document.createElement('div');
            tag.classList.add('sender-tag');
            tag.innerText = sender;
            
            const content = document.createElement('div');
            content.innerText = text;
            
            msgDiv.appendChild(tag);
            msgDiv.appendChild(content);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function askGemini(conversationHistory, systemInstruction) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            
            // Hard constraint injected seamlessly on top of text profiles
            const strictInstruction = `${systemInstruction} CRITICAL RULE: You must limit your entire response to a maximum of 3 sentences. Do not ramble.`;

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: conversationHistory,
                    systemInstruction: {
                        parts: [{ text: strictInstruction }]
                    }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "API request failed");
            }

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        async function runConvo() {
            const initialTopic = topicInput.value.trim();
            const systemInstruction1 = p1Input.value.trim();
            const systemInstruction2 = p2Input.value.trim();

            if (!GEMINI_API_KEY || GEMINI_API_KEY === "PASTE_YOUR_GEMINI_API_KEY_HERE") {
                alert("Please open the index.html file and update the GEMINI_API_KEY constant variable!");
                return;
            }
            if (!initialTopic) {
                alert("Please enter a starting topic!");
                return;
            }

            chatBox.innerHTML = '';
            startBtn.disabled = true;
            topicInput.disabled = true;
            presetSelect.disabled = true;
            p1Input.disabled = true;
            p2Input.disabled = true;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }

            try {
                let historyAI1 = [];
                let historyAI2 = [];

                appendMessage("System Topic", initialTopic, "system");
                let currentPrompt = initialTopic;

                for (let i = 0; i < 5; i++) {
                    
                    // --- Turn 1: Bot 1 ---
                    historyAI1.push({ role: 'user', parts: [{ text: currentPrompt }] });
                    appendMessage("Bot 1", "Formulating point...", ["thinking", "ai-one-thinking"]);
                    
                    let text1 = await askGemini(historyAI1, systemInstruction1);
                    let cleanText1 = text1.trim();
                    
                    chatBox.lastChild.remove(); 
                    appendMessage("Bot 1", cleanText1, "ai-one");
                    historyAI1.push({ role: 'model', parts: [{ text: text1 }] });
                    
                    await speakText(cleanText1, 1.1, 1.0, false);
                    await new Promise(r => setTimeout(r, DEBATE_DELAY));

                    // --- Turn 2: Bot 2 ---
                    historyAI2.push({ role: 'user', parts: [{ text: text1 }] });
                    appendMessage("Bot 2", "Drafting counterpoint...", ["thinking", "ai-two-thinking"]);

                    let text2 = await askGemini(historyAI2, systemInstruction2);
                    let cleanText2 = text2.trim();

                    chatBox.lastChild.remove(); 
                    appendMessage("Bot 2", cleanText2, "ai-two");
                    historyAI2.push({ role: 'model', parts: [{ text: text2 }] });

                    await speakText(cleanText2, 0.85, 0.95, true);
                    currentPrompt = cleanText2;

                    await new Promise(r => setTimeout(r, DEBATE_DELAY));
                }

                appendMessage("System", "Conversation concluded.", "system");

            } catch (error) {
                console.error(error);
                appendMessage("Error", "Details: " + error.message, "system");
            } finally {
                startBtn.disabled = false;
                topicInput.disabled = false;
                presetSelect.disabled = false;
                updatePresetUI(); // Restores accurate text state lockouts
            }
        }

        startBtn.addEventListener('click', runConvo);
    </script>
</body>
</html>
